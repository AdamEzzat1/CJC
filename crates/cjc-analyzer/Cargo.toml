[package]
name = "cjc-analyzer"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Experimental language server for CJC"

[dependencies]
# LSP protocol
lsp-server = "0.7"
lsp-types = "0.97"
serde_json = "1"
serde = { version = "1", features = ["derive"] }

# CJC workspace crates
cjc-ast.workspace = true
cjc-diag.workspace = true
cjc-lexer.workspace = true
cjc-parser.workspace = true
cjc-runtime.workspace = true
cjc-vizor.workspace = true

# Postulate Phase 1: run documents in both executors (src/postulate.rs)
cjc-ad.workspace = true
cjc-eval.workspace = true
cjc-hir.workspace = true
cjc-mir.workspace = true
cjc-mir-exec.workspace = true
cjc-snap.workspace = true
