[package]
name = "cjc-runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Runtime library: values, builtins, tensors, COW buffers"

[dependencies]
cjc-repro = { workspace = true }
cjc-regex = { workspace = true }

[dependencies.rayon]
version = "1"
optional = true

[features]
default = ["parallel"]
parallel = ["rayon"]
# Link the Bruchion native kernel pack (a prebuilt C-ABI static archive, no crate) and
# route selected hot loops to it behind a runtime switch that is off by default.
# Needs BRUCHION_KERNELS_DIR at build time; see build.rs and src/bruchion/mod.rs.
bruchion-kernels = []
